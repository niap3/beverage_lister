<!doctype html>
<!-- Source for assets/og-image.png (1200x630 share preview). Render with:
     chrome-headless-shell --screenshot=assets/og-image.png --window-size=1200,630
                           --hide-scrollbars --allow-file-access-from-files scripts/og-image.html
     The owner's Matta logo, text only otherwise, matching the site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
    background: #FFFFFF; color: #1B1B1A;
    font-family: system-ui, "Segoe UI", sans-serif;
  }
  img { width: 620px; height: auto; }
  .line { margin: 0; font-size: 40px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { margin: -18px 0 0; font-size: 28px; color: #66645E; }
  .pill {
    margin-top: 6px; padding: 14px 34px;
    border-radius: 999px; background: #15803D; color: #fff;
    font-size: 26px; font-weight: 500;
  }
</style>
</head>
<body>
  <img src="../assets/logo.svg" alt="">
  <p class="line">Kerala liquor prices, every bottle size</p>
  <p class="sub">From the Bevco price list, with the price per litre</p>
  <span class="pill">Unofficial · Free · No ads</span>
</body>
</html>
